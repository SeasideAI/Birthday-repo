<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0118" />
<title>Het Verborgen Cadeau — een verrassing voor mama</title>
<style>
:root{
  --bg-1:#0b0118;--bg-2:#1a0533;--bg-3:#2b0a4a;--accent:#ff2d95;--accent-2:#00e5ff;
  --gold:#ffd24a;--text:#f6f0ff;--muted:#b9a9d6;--ok:#38e08a;--err:#ff5d6c;
  --card:rgba(255,255,255,.06);--card-border:rgba(255,255,255,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  color:var(--text);
  font-family:ui-rounded,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 800px at 50% -10%,var(--bg-3),transparent 60%),
    radial-gradient(900px 700px at 10% 110%,#3a0d5e,transparent 55%),
    radial-gradient(900px 700px at 95% 100%,#08203a,transparent 55%),
    linear-gradient(160deg,var(--bg-1),var(--bg-2));
  background-attachment:fixed;min-height:100dvh;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,45,149,.07),rgba(0,229,255,.07),rgba(255,210,74,.07),rgba(255,45,149,.07));
  filter:blur(60px);animation:spin 28s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.shell{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 60px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:26px 22px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.45);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.kicker{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--bg-1);background:linear-gradient(90deg,var(--gold),#ffb347);padding:6px 12px;border-radius:999px;font-weight:800;margin-bottom:14px;}
h1{font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0 0 8px;font-weight:900;letter-spacing:-.02em;}
h2{font-size:clamp(22px,6vw,30px);margin:0 0 6px;font-weight:900;letter-spacing:-.01em;}
.subtitle{color:var(--accent-2);font-weight:700;margin:0 0 16px;}
.flavor{color:var(--muted);margin:0 0 18px;font-style:italic;}
.clue{white-space:pre-wrap;font-size:17px;line-height:1.55;background:rgba(0,0,0,.25);border:1px dashed var(--card-border);border-radius:14px;padding:16px;margin:0 0 18px;}
.body-text{color:var(--text);line-height:1.55;margin:0 0 22px;}
form{display:flex;gap:10px;flex-wrap:wrap;}
input[type=text]{flex:1 1 60%;min-width:0;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--card-border);background:rgba(0,0,0,.3);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;}
input[type=text]:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(0,229,255,.2);}
button{font-family:inherit;cursor:pointer;border:none;font-weight:800;font-size:17px;padding:14px 20px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--accent),#ff7ac2);box-shadow:0 10px 24px rgba(255,45,149,.35);transition:transform .12s,box-shadow .2s,opacity .2s;}
button:active{transform:translateY(1px) scale(.99);}
button:disabled{opacity:.6;cursor:not-allowed;}
.btn-block{width:100%;margin-top:4px;font-size:19px;padding:16px;}
.btn-ghost{background:transparent;color:var(--muted);box-shadow:none;border:1.5px solid var(--card-border);}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
.feedback{margin-top:14px;font-weight:700;min-height:22px;}
.feedback.ok{color:var(--ok);}
.feedback.err{color:var(--err);}
.shake{animation:shake .4s;}
@keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-8px);}40%,60%{transform:translateX(8px);}}
.hint-box{margin-top:16px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);border-radius:14px;padding:12px 16px;}
.hint-box p{margin:6px 0;color:#d7f7ff;}
.hint-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-weight:800;}
.progress{display:flex;gap:8px;justify-content:center;margin:0 0 22px;}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .4s;}
.dot.done{background:linear-gradient(135deg,var(--gold),#ffb347);box-shadow:0 0 12px var(--gold);}
.dot.active{background:var(--accent-2);box-shadow:0 0 12px var(--accent-2);transform:scale(1.25);}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;}
.reveal-shell{position:relative;z-index:3;text-align:center;}
.reveal-headline{font-size:clamp(30px,9vw,52px);font-weight:900;margin:0 0 6px;background:linear-gradient(90deg,var(--gold),#fff,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s cubic-bezier(.2,1.4,.3,1) both;}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-6deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
.reveal-sub{color:var(--text);font-size:18px;margin:0 0 26px;}
.ticket{position:relative;text-align:left;background:linear-gradient(135deg,#1c0938,#36106b);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:20px 22px;margin:0 auto 16px;max-width:460px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04);animation:ticketIn .7s cubic-bezier(.2,.8,.2,1) both;overflow:hidden;}
.ticket::after{content:"";position:absolute;top:0;bottom:0;left:64px;width:1px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);}
@keyframes ticketIn{from{opacity:0;transform:translateY(26px) rotate(-1.5deg);}to{opacity:1;transform:translateY(0) rotate(0);}}
.ticket .stub{position:absolute;left:0;top:0;bottom:0;width:64px;display:flex;align-items:center;justify-content:center;font-size:30px;}
.ticket-inner{padding-left:70px;}
.ticket .ev-name{font-size:20px;font-weight:900;margin:0 0 2px;color:var(--gold);}
.ticket .ev-line{margin:3px 0;color:var(--text);font-size:15px;}
.ticket .ev-line .lbl{color:var(--muted);display:inline-block;min-width:78px;}
.ticket .who{margin-top:10px;font-weight:800;color:var(--accent-2);}
.message-card{max-width:460px;margin:22px auto 0;background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:20px 22px;text-align:left;line-height:1.6;}
.message-card .signoff{margin-top:12px;font-weight:800;color:var(--gold);}
.replay{margin-top:26px;}
.tiny{color:var(--muted);font-size:13px;margin-top:18px;}
.center{text-align:center;}
.curtain{position:relative;height:130px;margin:6px auto 18px;max-width:340px;border-radius:14px;overflow:hidden;background:#160630;border:1px solid var(--card-border);box-shadow:inset 0 0 30px rgba(0,0,0,.6);}
.curtain__left,.curtain__right{position:absolute;top:0;bottom:0;width:51%;z-index:2;transition:transform .7s cubic-bezier(.7,0,.3,1);background:repeating-linear-gradient(90deg,#7a0f3a 0 14px,#a3164e 14px 28px);box-shadow:inset -10px 0 22px rgba(0,0,0,.45);}
.curtain__left{left:0;}
.curtain__right{right:0;box-shadow:inset 10px 0 22px rgba(0,0,0,.45);}
.curtain.open .curtain__left{transform:translateX(-100%);}
.curtain.open .curtain__right{transform:translateX(100%);}
.curtain__gift{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;z-index:1;animation:giftPulse 1.6s ease-in-out infinite;}
@keyframes giftPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="app" class="shell"></main>

<script>

))));
// "Inge" wordt overal "mama" (ook in de reveal-titel)
GIFT.headline = GIFT.headline.replace(/Inge/g, "mama");

var INTRO = {
  title:"Het Verborgen Cadeau",
  subtitle:"Een geheime escape voor mama",
  body:"Dag mama! Iemand heeft een cadeau voor je verstopt achter vijf sloten — en het laatste is een echt meesterslot. Kraak ze één voor één en de gordijnen gaan open. Elke aanwijzing heeft hints als je even vastzit, maar probeer het eerst zelf. Klaar? Licht uit, spots aan.",

};

var STAGES = [
  { id:"slot1", lock:"Slot 1 van 5", title:"Stem je gitaar",
    flavor:"Elke rocklegende begint met dit instrument in de hand.",
    clue:"Herschik deze letters tot één woord:\n\nR · A · A · T · I · G",

    hints:["Het zijn 6 letters en je bespeelt het met snaren.",
           "Een rockband zonder dit instrument? Ondenkbaar. Het begint met een G.",

    hints:["Vraag 1: tel de snaren op een klassieke gitaar… het zijn er zes.",

           "Vraag 3 is U2, vraag 4 is Maroon 5. De code wordt dus 6 4 2 5."] },
  { id:"slot3", lock:"Slot 3 van 5", title:"De geheime plek",
    flavor:"Een klassieke geheimschrift-truc: schuif het alfabet op.",
    clue:"Schuif elke letter 1 plekje TERUG in het alfabet (B wordt A, C wordt B, ...):\n\nQ · P · E · J · V · N\n\nWelk woord verschijnt er? (Het is de plek waar de band staat te spelen.)",
    placeholder:"Het ontcijferde woord",
    hints:["Q terug = P, P terug = O. Begin alvast: P O …",
           "Het is de verhoging waarop de artiesten staan tijdens een concert.",
           "P O D I U _  … nog één letter (M terug van N)."] },
  { id:"slot4", lock:"Slot 4 van 5", title:"Het toegangsslot",

  { id:"slot5", lock:"Laatste slot", title:"Het meesterslot",
    flavor:"De allerlaatste kluis opent niet met een woord, maar met één getal.",
    clue:"Eén code kraakte je eerder al: een rij van vier cijfers.\n\nTel die vier cijfers bij elkaar op. Welk getal opent het meesterslot?",
    placeholder:"Eén getal",
    hints:["Het gaat om de code uit het cijferslot (slot 2).",

// ---------- helpers ----------
function normalize(v){
  return String(v||"").toLowerCase().normalize("NFD")
    .replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
}
function isCorrect(id,ans){
  var list=ANSWERS[id]||[]; var g=normalize(ans); if(!g) return false;
  for(var i=0;i<list.length;i++){ if(normalize(list[i])===g) return true; }
  return false;
}
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ---------- state ----------
var app=document.getElementById("app");
var state={ idx:0, solved:{}, hintLevel:0, wrong:0 };

function render(){ /* set by screens */ }

// ---------- INTRO ----------
function screenIntro(){
  app.innerHTML="";
  var c=el('<div class="card center"></div>');
  c.innerHTML=
    '<span class="kicker">\u{1F382} Gelukkige verjaardag</span>'+
    '<h1>'+esc(INTRO.title)+'</h1>'+
    '<p class="subtitle">'+esc(INTRO.subtitle)+'</p>'+
    '<p class="body-text">'+esc(INTRO.body)+'</p>'+
    '<button class="btn-block" id="startBtn">'+esc(INTRO.startLabel)+' \u{1F3B6}</button>';
  app.appendChild(c);
  document.getElementById("startBtn").onclick=function(){
    state={idx:0,solved:{},hintLevel:0,wrong:0};
    screenPlay();
  };
}

// ---------- PLAY ----------
function screenPlay(){
  var s=STAGES[state.idx];
  app.innerHTML="";
  var dots="";
  for(var i=0;i<STAGES.length;i++){
    var cls="dot"+(state.solved[STAGES[i].id]?" done":(i===state.idx?" active":""));
    dots+='<span class="'+cls+'"></span>';
  }
  var c=el('<div class="card"></div>');
  c.innerHTML=
    '<div class="progress">'+dots+'</div>'+
    '<span class="kicker">'+esc(s.lock)+'</span>'+
    '<h2>'+esc(s.title)+'</h2>'+
    '<p class="flavor">'+esc(s.flavor)+'</p>'+
    '<div class="clue">'+esc(s.clue)+'</div>'+
    '<form id="f"><input id="inp" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="'+esc(s.placeholder)+'"/>'+
    '<button type="submit" id="go">Probeer</button></form>'+
    '<div class="feedback" id="fb"></div>'+
    '<div class="row">'+
      '<button type="button" class="btn-ghost" id="hintBtn">Geef me een hint \u{1F4A1}</button>'+
      '<span class="tiny">Slot '+(state.idx+1)+' van '+STAGES.length+'</span>'+
    '</div>'+
    '<div id="hints"></div>';
  app.appendChild(c);

  var inp=document.getElementById("inp");
  var fb=document.getElementById("fb");
  var hintsBox=document.getElementById("hints");
  inp.focus();

  function renderHints(){
    if(state.hintLevel<=0){ hintsBox.innerHTML=""; return; }
    var h='<div class="hint-box"><span class="hint-label">Hints</span>';
    for(var i=0;i<state.hintLevel && i<s.hints.length;i++){ h+='<p>'+(i+1)+'. '+esc(s.hints[i])+'</p>'; }
    h+='</div>'; hintsBox.innerHTML=h;
  }
  document.getElementById("hintBtn").onclick=function(){
    state.hintLevel=Math.min(state.hintLevel+1,s.hints.length);
    if(state.hintLevel>=s.hints.length) this.textContent="Geen hints meer", this.disabled=true;
    renderHints();
  };

  document.getElementById("f").onsubmit=function(e){
    e.preventDefault();
    var val=inp.value.trim(); if(!val) return;
    if(isCorrect(s.id,val)){
      state.solved[s.id]=true;
      fb.className="feedback ok"; fb.textContent="Klik! Het slot springt open. ✨";
      document.getElementById("go").disabled=true; inp.disabled=true;
      setTimeout(function(){
        if(state.idx===STAGES.length-1){ screenUnlocked(); }
        else { state.idx++; state.hintLevel=0; state.wrong=0; screenPlay(); }
      },850);
    } else {
      state.wrong++;
      c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
      var extra=(state.wrong>=2 && state.hintLevel<s.hints.length)?" Tip: klik op 'Geef me een hint'.":"";
      fb.className="feedback err"; fb.textContent="Nog niet juist, probeer gerust opnieuw."+extra;
    }
  };
}

// ---------- UNLOCKED (tussenscherm: bouw de spanning op) ----------
function screenUnlocked(){
  app.innerHTML="";
  var c=el('<div class="card center"></div>');
  c.innerHTML=
    '<span class="kicker">\u{1F513} Alle sloten geopend</span>'+
    '<h1>De gordijnen…</h1>'+
    '<p class="subtitle">…staan op het punt open te gaan.</p>'+
    '<div class="curtain" id="curtain"><div class="curtain__gift">\u{1F381}</div><div class="curtain__left"></div><div class="curtain__right"></div></div>'+
    '<p class="body-text">Vijf sloten gekraakt — meesterslot incluis. Wat erachter zit, ontdek je zo. Even diep ademhalen…</p>'+
    '<button class="btn-block" id="openBtn">Open je cadeau \u{1F3AD}</button>';
  app.appendChild(c);
  document.getElementById("openBtn").onclick=function(){
    var cu=document.getElementById("curtain"); if(cu) cu.classList.add("open");
    this.disabled=true; this.textContent="✨";
    setTimeout(screenReveal,750);
  };
}

// ---------- REVEAL ----------
function screenReveal(){
  app.innerHTML="";
  var ev=GIFT.event, tickets="";
  for(var i=0;i<GIFT.tickets.length;i++){
    var tk=GIFT.tickets[i];
    tickets+=
      '<div class="ticket" style="animation-delay:'+(0.15+i*0.3)+'s"><div class="stub">\u{1F3B8}</div><div class="ticket-inner">'+
      '<p class="ev-name">'+esc(ev.name)+'</p>'+
      '<p class="ev-line">'+esc(ev.tagline)+'</p>'+
      '<p class="ev-line"><span class="lbl">Datum</span> '+esc(ev.date)+'</p>'+
      '<p class="ev-line"><span class="lbl">Uren</span> '+esc(ev.doors)+'</p>'+
      '<p class="ev-line"><span class="lbl">Locatie</span> '+esc(ev.location)+'</p>'+
      '<p class="ev-line"><span class="lbl">Plaats</span> '+esc(ev.seat)+'</p>'+
      '<p class="who">'+esc(tk.who)+'</p></div></div>';
  }
  var c=el('<div class="reveal-shell"></div>');
  c.innerHTML=
    '<div class="kicker">\u{1F3AB} Verrassing ontgrendeld</div>'+
    '<h1 class="reveal-headline">'+esc(GIFT.headline)+'</h1>'+
    '<p class="reveal-sub">'+esc(GIFT.subhead)+'</p>'+
    tickets+
    '<div class="message-card"><p class="body-text" style="margin:0">'+esc(GIFT.message)+'</p>'+
    '<p class="signoff">'+esc(GIFT.signoff)+'</p></div>'+
    '<p class="tiny">De echte e-tickets (op naam van '+esc(ev.holder)+') bewaart Kenzo veilig voor aan de ingang. \u{1F49C}</p>'+
    '<div class="replay"><button class="btn-ghost" id="replay">Speel opnieuw</button></div>';
  app.appendChild(c);
  document.getElementById("replay").onclick=screenIntro;
  celebrate();
  playFanfare();
}

// ---------- fanfare (Web Audio) ----------
function playFanfare(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var ctx=new AC(), now=ctx.currentTime, notes=[523.25,659.25,783.99,1046.5];
    notes.forEach(function(f,i){
      var o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle"; o.frequency.value=f;
      var t=now+i*0.14;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.55);
    });
  }catch(e){}
}

// ---------- vuurwerk + confetti op canvas ----------
function celebrate(){
  var canvas=document.getElementById("fx"); canvas.style.display="block";
  var ctx=canvas.getContext("2d"); var w,h,dpr;
  function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); w=canvas.clientWidth=window.innerWidth; h=canvas.clientHeight=window.innerHeight; canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  resize(); window.addEventListener("resize",resize);
  var palette=["#ff2d95","#00e5ff","#ffd24a","#38e08a","#ff7ac2","#a06bff"];
  var rockets=[],sparks=[],confs=[];
  function rand(a,b){return a+Math.random()*(b-a);}
  function launch(){ rockets.push({x:rand(w*0.15,w*0.85),y:h,vy:-rand(7,10.5),color:palette[(Math.random()*palette.length)|0],dead:false}); }
  function explode(x,y,col){ var n=60+((Math.random()*40)|0); for(var i=0;i<n;i++){ var a=(Math.PI*2*i)/n,s=rand(1.5,5.5); sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:50+((Math.random()*35)|0),color:col}); } }
  // initiële confetti-burst
  for(var k=0;k<160;k++){ confs.push({x:rand(0,w),y:rand(-h,0),vx:rand(-1.5,1.5),vy:rand(2,5),rot:rand(0,6.28),vr:rand(-.2,.2),sz:rand(5,11),color:palette[(Math.random()*palette.length)|0]}); }
  var last=0,start=performance.now();
  function frame(t){
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="rgba(11,1,24,0.22)"; ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation="lighter";
    if(t-last>380){ launch(); if(Math.random()>0.5) launch(); last=t; }
    for(var i=0;i<rockets.length;i++){ var r=rockets[i]; r.y+=r.vy; r.vy+=0.06; ctx.beginPath(); ctx.fillStyle=r.color; ctx.arc(r.x,r.y,2.5,0,6.283); ctx.fill(); if(r.vy>=-1.2&&!r.dead){ r.dead=true; explode(r.x,r.y,r.color); } }
    rockets=rockets.filter(function(r){return !r.dead && r.y<h+10;});
    for(var j=0;j<sparks.length;j++){ var sp=sparks[j]; sp.life++; sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.045; sp.vx*=0.99; ctx.globalAlpha=Math.max(1-sp.life/sp.max,0); ctx.beginPath(); ctx.fillStyle=sp.color; ctx.arc(sp.x,sp.y,2.2,0,6.283); ctx.fill(); }
    ctx.globalAlpha=1; sparks=sparks.filter(function(s){return s.life<s.max;});
    // confetti (normaal getekend)
    ctx.globalCompositeOperation="source-over";
    for(var m=0;m<confs.length;m++){ var cf=confs[m]; cf.x+=cf.vx; cf.y+=cf.vy; cf.vy+=0.03; cf.rot+=cf.vr; if(cf.y>h+20){ cf.y=-20; cf.x=rand(0,w); cf.vy=rand(2,5); } ctx.save(); ctx.translate(cf.x,cf.y); ctx.rotate(cf.rot); ctx.fillStyle=cf.color; ctx.fillRect(-cf.sz/2,-cf.sz/2,cf.sz,cf.sz*0.6); ctx.restore(); }
    // confetti langzaam laten uitdoven na 6s
    if(t-start>6000 && confs.length>0 && (t|0)%2===0){ confs.pop(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// start
screenIntro();
